<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drummer Pro - Songs BPM</title><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0A1128;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;overflow-x:hidden;overscroll-behavior:none}
header{padding:14px 20px 0}.top{font-size:11px;letter-spacing:3px;color:#7ee8b8;font-weight:800}.title{font-size:22px;font-weight:900;line-height:1;margin-top:1px}.sub{font-size:11px;color:#9aa3c7;margin-top:4px}.tabs{display:flex;gap:8px;padding:8px 20px 0}.tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;background:#141b3a;font-size:13px;color:#aab;cursor:pointer}.tab.on{background:#1e2a5a;color:#fff}.search{margin:8px 20px 0;background:#141b3a;border-radius:10px;padding:10px 12px;display:flex;gap:8px}.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px}.list{padding:10px 20px 90px}.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #1a2348;cursor:pointer}.num{width:32px;font-size:20px;font-weight:800;text-align:center}.info{flex:1;min-width:0}.stitle{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:#9aa3c7;margin-top:1px}.bpm{font-size:11px;color:#7ee8b8;text-align:right}.bpm b{display:block;font-size:20px;color:#fff}.dots{font-size:20px;padding:0 4px;color:#9aa3c7}.btn{position:fixed;bottom:18px;left:20px;right:20px;background:#2ee8a8;color:#0A1128;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px;cursor:pointer}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50}.sheet.open{display:flex}.card{background:#0B0F24;width:100%;border-radius:20px 20px 0 0;padding:16px 20px 24px;max-height:88vh;overflow:auto}.card h3{font-size:12px;letter-spacing:2px;color:#7ee8b8}.card h2{font-size:22px;margin:6px 0 2px}.card .art{font-size:13px;color:#9aa3c7}.bpmbig{font-size:56px;font-weight:900;text-align:center;margin:10px 0}.bpmbig span{font-size:14px;color:#9aa3c7}.row2{display:flex;gap:8px;align-items:center;margin:8px 0}.pill{flex:1;background:#141b3a;border:0;color:#fff;padding:10px;border-radius:10px;cursor:pointer}.pill.on{background:#2ee8a8;color:#0A1128;font-weight:800}.tap{flex:1;background:#2ee8a8;color:#0A1128;border:0;padding:12px;border-radius:12px;font-weight:900}.hamb{background:#141b3a;color:#fff;border:0;width:46px;height:46px;border-radius:12px;font-size:20px;cursor:pointer}input[type=range]{width:100%;accent-color:#2ee8a8}.play{width:100%;background:#2ee8a8;border:0;padding:14px;border-radius:14px;font-weight:900;font-size:16px;margin-top:10px;color:#0A1128}.small{font-size:11px;color:#9aa3c7}.sethead{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 0}.add{background:#2ee8a8;color:#0A1128;border:0;padding:8px 14px;border-radius:10px;font-weight:800}input,select{width:100%;background:#141b3a;border:0;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
</style></head><body>
<header><div class="top">DRUMMER PRO</div><div class="title" id="headTitle">Songs BPM</div><div class="sub" id="headSub">Drumwell â€¢ <span id="count"></span> songs</div></header>
<div class="tabs"><div class="tab on" onclick="showTab('songs',this)">Song Library</div><div class="tab" onclick="showTab('sets',this)">Setlists</div></div>
<div class="search"><span>ðŸ”</span><input id="q" placeholder="Search songs..." oninput="render()"></div>
<div class="sethead" id="setHead" style="display:none"><b>Your Setlists</b><button class="add" onclick="addSet()">+ Add Setlist</button></div>
<div class="list" id="list"></div>
<button class="btn" onclick="openAdd()">+ Add Song</button>
<div class="sheet" id="addSheet"><div class="card"><h3>ADD SONG</h3><input id="fTitle" placeholder="Title"><input id="fArtist" placeholder="Artist"><input id="fBpm" type="number" placeholder="BPM e.g. 120"><button class="play" onclick="saveSong()">Save Song</button><button class="pill" onclick="closeAdd()">Cancel</button></div></div>
<div class="sheet" id="metro"><div class="card">
<div style="display:flex;justify-content:space-between"><h3>DRUMWELL METRONOME</h3><button class="pill" style="flex:none;padding:6px 12px" onclick="closeMetro()">âœ•</button></div>
<h2 id="mTitle">Alone</h2><div class="art" id="mArtist">Heart</div>
<div style="display:flex;justify-content:center;gap:10px;margin:8px 0"><button class="pill" onclick="prevSong()">â—€ Prev</button><button class="pill" onclick="nextSong()">Next â–¶</button></div>
<div class="bpmbig"><span id="mBpm">156</span> <span>BPM</span></div>
<input type="range" id="bpmRange" min="40" max="240" value="156" oninput="setBpm(this.value)">
<div class="row2"><button class="hamb" onclick="openSettings()">â˜°</button><button class="tap" onclick="tapTempo()">TAP TEMPO</button><select id="ts" style="flex:none;width:90px"><option>4/4</option><option>3/4</option><option>6/8</option></select></div>
<div class="small">Volume</div><input type="range" id="vol" min="0" max="100" value="100" oninput="volVal=this.value/100">
<div class="small" id="nextLbl">Next: Before I Let You Go</div>
<button class="play" id="playBtn" onclick="togglePlay()">â–¶ PLAY</button></div></div>
<div class="sheet" id="settings"><div class="card"><h3>SOUND SETTINGS</h3><p class="small" style="margin:8px 0">Click Sound</p>
<div class="row2"><button class="pill on" id="pWood" onclick="setSound('wood')">Wood</button><button class="pill" id="pClick" onclick="setSound('click')">Click</button><button class="pill" id="pBeep" onclick="setSound('beep')">Beep</button><button class="pill" id="pCow" onclick="setSound('cowbell')">Cowbell</button></div>
<label class="pill" style="display:block;text-align:center;margin-top:8px">Upload Custom Sound (.wav / .mp3)<input type="file" id="customFile" accept="audio/*" style="display:none" onchange="loadCustom(event)"></label>
<div class="small" id="customName"></div>
<div class="small" style="margin-top:10px">Volume</div><input type="range" min="0" max="100" value="100" oninput="volVal=this.value/100;document.getElementById('vol').value=this.value">
<button class="play" onclick="closeSettings()">Done</button></div></div>
<script>
let songs=[{t:"Alone",a:"Heart",b:156},{t:"Before I Let You Go",a:"Freestyle",b:104},{t:"Dreams",a:"The Cranberries",b:134},{t:"Drive",a:"Incubus",b:140},{t:"I Love You Always Forever",a:"Donna Lewis",b:102},{t:"Me Too",a:"Meghan Trainor",b:150},{t:"Superstition",a:"Stevie Wonder",b:100}];
let sets=[{name:"Set A",songs:[0,1,2]},{name:"Set B",songs:[3,4]},{name:"Set C",songs:[5,6]}];
let tab='songs', cur=0, playing=false, timer=null, beat=0, bpm=156, volVal=1, sound='wood', taps=[];
let actx=null, woodBuf=null, cowBuf=null, customBuf=null;
async function initAudio(){ if(actx) return; actx=new (window.AudioContext||window.webkitAudioContext)(); try{ woodBuf=await loadBuf('wood.wav'); cowBuf=await loadBuf('cowbell.wav'); }catch(e){} }
async function loadBuf(u){ let r=await fetch(u); let b=await r.arrayBuffer(); return await actx.decodeAudioData(b); }
function synth(type,accent){ let t=actx.currentTime; if(type==='beep'){ let o=actx.createOscillator(),g=actx.createGain(); o.frequency.value=880; g.gain.setValueAtTime(accent?1:0.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.08); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.09); } else { let len=actx.sampleRate*0.03, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2); let src=actx.createBufferSource(); src.buffer=buf; let f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=type==='click'?2000:900; let g=actx.createGain(); g.gain.value=accent?1:.7; src.connect(f).connect(g).connect(actx.destination); src.start(t); } }
function playClick(accent){ if(!actx) return; let buf = sound==='wood'?woodBuf : sound==='cowbell'?cowBuf : sound==='custom'?customBuf : null; if(buf){ let s=actx.createBufferSource(); s.buffer=buf; let g=actx.createGain(); g.gain.value=volVal*(accent?1:.8); s.connect(g).connect(actx.destination); s.start(); } else synth(sound,accent); }
function tick(){ beat++; let per = 60/bpm*1000; let isAccent = (beat-1)%4===0; playClick(isAccent); timer=setTimeout(tick, per); }
async function togglePlay(){ await initAudio(); if(actx.state==='suspended') actx.resume(); if(playing){ clearTimeout(timer); playing=false; document.getElementById('playBtn').textContent='â–¶ PLAY'; } else { playing=true; beat=0; document.getElementById('playBtn').textContent='â¸ STOP'; tick(); } }
function setBpm(v){ bpm=+v; document.getElementById('mBpm').textContent=v; songs[cur].b=+v; render(); }
function tapTempo(){ let n=Date.now(); taps.push(n); taps=taps.filter(x=>n-x<2000); if(taps.length>1){ let diffs=[]; for(let i=1;i<taps.length;i++) diffs.push(taps[i]-taps[i-1]); let avg=diffs.reduce((a,b)=>a+b)/diffs.length; let nb=Math.round(60000/avg); nb=Math.max(40,Math.min(240,nb)); document.getElementById('bpmRange').value=nb; setBpm(nb); } }
function setSound(s){ sound=s; ['pWood','pClick','pBeep','pCow'].forEach(id=>document.getElementById(id).classList.remove('on')); if(s==='wood') pWood.classList.add('on'); if(s==='click') pClick.classList.add('on'); if(s==='beep') pBeep.classList.add('on'); if(s==='cowbell') pCow.classList.add('on'); initAudio().then(()=>playClick(true)); }
async function loadCustom(e){ await initAudio(); let f=e.target.files[0]; if(!f) return; let b=await f.arrayBuffer(); customBuf=await actx.decodeAudioData(b); sound='custom'; document.getElementById('customName').textContent='Custom: '+f.name; playClick(true); }
function showTab(t,el){ tab=t; document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); el.classList.add('on'); document.getElementById('setHead').style.display=t==='sets'?'flex':'none'; document.getElementById('headTitle').textContent=t==='sets'?'Setlists':'Songs BPM'; render(); }
function render(){ let q=document.getElementById('q').value.toLowerCase(); let el=document.getElementById('list'); el.innerHTML=''; if(tab==='songs'){ let sorted=[...songs].map((s,i)=>({...s,i})).sort((a,b)=>a.t.localeCompare(b.t)).filter(s=>(s.t+s.a).toLowerCase().includes(q)); document.getElementById('count').textContent=sorted.length; sorted.forEach((s,idx)=>{ el.innerHTML+=`<div class="row" onclick="openMetro(${s.i})"><div class="num">${idx+1}</div><div class="info"><div class="stitle">${s.t}</div><div class="artist">${s.a}</div></div><div class="bpm"><b>${s.b}</b>BPM</div><div class="dots">â‹®</div></div>`; }); } else { document.getElementById('count').textContent=sets.length; sets.forEach((st,i)=>{ el.innerHTML+=`<div class="row" onclick="openSet(${i})"><div class="num">â™ª</div><div class="info"><div class="stitle">${st.name}</div><div class="artist">${st.songs.length} songs</div></div><div class="dots">â€º</div></div>`; }); } }
function openMetro(i){ cur=i; document.getElementById('mTitle').textContent=songs[i].t; document.getElementById('mArtist').textContent=songs[i].a; document.getElementById('mBpm').textContent=songs[i].b; document.getElementById('bpmRange').value=songs[i].b; bpm=songs[i].b; let nx=songs[(i+1)%songs.length]; document.getElementById('nextLbl').textContent='Next: '+nx.t; document.getElementById('metro').classList.add('open'); }
function closeMetro(){ document.getElementById('metro').classList.remove('open'); }
function openSet(i){ alert(sets[i].name+': '+sets[i].songs.map(x=>songs[x].t).join(', ')); }
function prevSong(){ let was=playing; if(playing) togglePlay(); cur=(cur-1+songs.length)%songs.length; openMetro(cur); if(was) togglePlay(); }
function nextSong(){ let was=playing; if(playing) togglePlay(); cur=(cur+1)%songs.length; openMetro(cur); if(was) togglePlay(); }
function openAdd(){ document.getElementById('addSheet').classList.add('open'); } function closeAdd(){ document.getElementById('addSheet').classList.remove('open'); }
function saveSong(){ let t=document.getElementById('fTitle').value, a=document.getElementById('fArtist').value, b=+document.getElementById('fBpm').value||120; if(!t) return; songs.push({t,a,b}); closeAdd(); render(); }
function addSet(){ let n=prompt('Setlist name:','Set D'); if(n) sets.push({name:n,songs:[]}); render(); }
function openSettings(){ document.getElementById('settings').classList.add('open'); } function closeSettings(){ document.getElementById('settings').classList.remove('open'); }
render();
</script></body></html>
